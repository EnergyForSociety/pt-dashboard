<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>แผนที่ตัวเลข PT Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: one root node → three branch columns (one per report page), then the bridges that join their numbers, then cautions and a question→number guide */
:root{
  --bg:#F3F6F4; --surface:#FFFFFF; --ink:#13241B; --ink2:#3B5045; --line:#C9D6CE;
  --pt:#0E7A3C; --pt-soft:#E3F2E8;
  --seg:#B26A00; --seg-soft:#FBF0DE;      /* กลุ่มลูกค้า = บิล */
  --name:#0E6E85; --name-soft:#E0F1F5;    /* วิเคราะห์สมาชิก = ชื่อ */
  --card:#1D4E9E; --card-soft:#E4ECF9;    /* Active = บัตร */
  --warn:#A8461A; --warn-soft:#FCEDE5; --on:#FFFFFF;
  --f-display:"IBM Plex Sans Thai","Leelawadee UI","Tahoma",sans-serif;
  --f-body:"IBM Plex Sans Thai","Leelawadee UI","Tahoma",sans-serif;
  --f-num:"IBM Plex Mono","Consolas",monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1713; --surface:#16211B; --ink:#E6EFE9; --ink2:#A9BCB1; --line:#2E3F35;
  --pt:#4CC27E; --pt-soft:#173323;
  --seg:#E9A445; --seg-soft:#2E2412;
  --name:#4BBAD3; --name-soft:#12292F;
  --card:#7FA6EC; --card-soft:#18233A;
  --warn:#F08A5B; --warn-soft:#331C12; --on:#0B1A12; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0F1713; --surface:#16211B; --ink:#E6EFE9; --ink2:#A9BCB1; --line:#2E3F35;
  --pt:#4CC27E; --pt-soft:#173323;
  --seg:#E9A445; --seg-soft:#2E2412;
  --name:#4BBAD3; --name-soft:#12292F;
  --card:#7FA6EC; --card-soft:#18233A;
  --warn:#F08A5B; --warn-soft:#331C12; --on:#0B1A12; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
.wrap{max-width:1180px;margin:0 auto;padding-block:28px 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.3}
h1{font-size:28px;font-weight:700}
h2{font-size:20px;font-weight:700;margin-bottom:14px}
h3{font-size:16px;font-weight:700}
p{margin:0}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-weight:600}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--ink2)}
.lede{color:var(--ink2);max-width:68ch;margin-top:8px}
section{margin-top:40px}

/* ── mind map ── */
.root{display:flex;justify-content:center;margin-top:28px}
.root-node{background:var(--pt);color:var(--on);border-radius:14px;padding:14px 22px;text-align:center;max-width:520px}
.root-node .t{font-size:18px;font-weight:700}
.root-node .s{font-size:13px;opacity:.9}
.src{margin:14px auto 0;max-width:860px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.src div{background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:8px 12px;font-size:13px;color:var(--ink2)}
.src b{color:var(--ink);font-family:var(--f-num);font-size:12.5px;font-weight:600}
.trunk{height:26px;width:2px;background:var(--line);margin:0 auto}
.branches{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;position:relative;padding-top:22px}
.branches::before{content:"";position:absolute;top:0;left:16.6%;right:16.6%;height:2px;background:var(--line)}
.branch{position:relative;min-width:0}
.branch::before{content:"";position:absolute;top:-22px;left:50%;width:2px;height:22px;background:var(--line)}
.bhead{border-radius:12px;padding:12px 14px;border:2px solid var(--c);background:var(--soft)}
.bhead .unit{display:inline-block;background:var(--c);color:var(--on);font-size:12px;font-weight:700;border-radius:20px;padding:1px 10px;margin-top:6px}
.bhead .big{font-size:30px;line-height:1.1;color:var(--c);margin-top:8px}
.bhead .big small{font-size:14px;font-family:var(--f-body);font-weight:600;margin-left:4px}
.leaves{list-style:none;margin:0;padding:0 0 0 18px;border-left:2px solid var(--line);margin-left:20px}
.leaves li{position:relative;margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:14px}
.leaves li::before{content:"";position:absolute;left:-20px;top:20px;width:18px;height:2px;background:var(--line)}
.leaves .k{font-weight:700}
.leaves .v{float:right;margin-left:10px;color:var(--c)}
.leaves .how{display:block;color:var(--ink2);font-size:12.5px;margin-top:2px}
.leaves code{font-family:var(--f-num);font-size:12px;background:var(--soft);border-radius:4px;padding:0 4px}
.b-seg{--c:var(--seg);--soft:var(--seg-soft)}
.b-name{--c:var(--name);--soft:var(--name-soft)}
.b-card{--c:var(--card);--soft:var(--card-soft)}

/* ── bridges ── */
.bridges{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.bridge{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.eq{font-family:var(--f-num);font-size:17px;margin:8px 0 6px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.eq span{border-radius:6px;padding:1px 7px}
.eq .s{background:var(--seg-soft);color:var(--seg)} .eq .n{background:var(--name-soft);color:var(--name)} .eq .c{background:var(--card-soft);color:var(--card)}
.bridge p{font-size:13.5px;color:var(--ink2)}

/* ── cautions ── */
.cautions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.caution{background:var(--warn-soft);border-left:4px solid var(--warn);border-radius:8px;padding:12px 16px;min-width:0}
.caution h3{color:var(--warn);font-size:15px}
.caution p{font-size:14px;margin-top:4px}
.sev{display:inline-block;font-size:11.5px;font-weight:700;color:var(--on);background:var(--warn);border-radius:20px;padding:0 9px;margin-left:6px;vertical-align:2px}

/* ── guide table ── */
.tbl{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:680px;font-size:14px}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12.5px;color:var(--ink2);font-weight:700;letter-spacing:.03em}
tr:last-child td{border-bottom:0}
.tag{display:inline-block;font-size:12px;font-weight:700;border-radius:20px;padding:0 9px}
.tag.s{background:var(--seg-soft);color:var(--seg)} .tag.n{background:var(--name-soft);color:var(--name)} .tag.c{background:var(--card-soft);color:var(--card)}
.foot{margin-top:28px;font-size:12.5px;color:var(--ink2)}

@media (max-width:860px){
  .branches,.bridges,.src{grid-template-columns:1fr}
  .branches::before,.branch::before{display:none}
  .branches{padding-top:0;gap:26px}
  .cautions{grid-template-columns:1fr}
}

.k-sales{--c:var(--pt);--soft:var(--pt-soft)} .k-cust{--c:var(--card);--soft:var(--card-soft)}
.k-money{--c:var(--seg);--soft:var(--seg-soft)} .k-ops{--c:var(--name);--soft:var(--name-soft)}
.toc{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;margin-top:22px}
.toc-i{display:flex;gap:10px;align-items:center;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:8px;padding:8px 12px;font-size:14px;font-weight:600}
.toc-i:hover{background:var(--soft)} .toc-i .num{color:var(--c);font-size:13px}
.found{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.fd{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.fd-v{font-size:22px;color:var(--pt)} .fd-k{font-weight:700;margin-top:2px} .fd p{font-size:13px;color:var(--ink2);margin-top:4px}
.fd code,.ot code{font-family:var(--f-num);font-size:12px;background:var(--pt-soft);border-radius:4px;padding:0 5px}
.pg{margin-top:26px;scroll-margin-top:16px}
.pg-head{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;background:var(--soft);border:2px solid var(--c);border-radius:12px;padding:12px 16px}
.pg-head>div{flex:1;min-width:220px} .pg-head p{font-size:13.5px;color:var(--ink2)}
.pg-no{font-size:28px;color:var(--c);line-height:1}
.unitchip{background:var(--c);color:var(--on);font-size:12.5px;font-weight:700;border-radius:20px;padding:2px 12px}
.pg-body{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start}
.pg-body .leaves{margin-left:22px}
.chk{margin-top:12px;background:var(--warn-soft);border-left:4px solid var(--warn);border-radius:8px;padding:10px 14px;font-size:13.5px}
.chk.ans{background:var(--pt-soft);border-left-color:var(--pt)} .chk.ans b{color:var(--pt)}
.chk b{color:var(--warn)} .chk ul{margin:6px 0 0;padding-left:18px} .chk li{margin-top:4px}
.member-wrap{margin-top:26px;scroll-margin-top:16px}
.others{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.ot{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:10px;padding:12px 14px;min-width:0}
.ot p{font-size:13.5px;color:var(--ink2);margin:4px 0 6px}
@media (max-width:860px){.found,.others,.pg-body{grid-template-columns:1fr}}


.lock{min-height:80vh;display:grid;place-items:center;padding-block:24px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.lock form{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px;width:min(100%,380px);display:flex;flex-direction:column;gap:12px}
.lock h1{font-size:22px}
.lock p{margin:0;color:var(--ink2);font-size:13.5px;line-height:1.55}
.lock button{font:inherit;font-weight:600;padding:10px 12px;border:0;border-radius:8px;background:var(--pt);color:var(--on);cursor:pointer}
.lock button:disabled{opacity:.6;cursor:progress}
.lock button.ghost{background:transparent;color:var(--pt);border:1px solid var(--line)}
.lock .err{color:var(--warn);min-height:1.2em}
.lock button:focus-visible,.userbar button:focus-visible{outline:2px solid var(--pt);outline-offset:2px}
.topbar{max-width:1180px;margin:0 auto;display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;gap:10px;padding-top:14px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.userbar{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2)}
.userbar button{font:inherit;border:1px solid var(--line);background:var(--surface);color:var(--ink2);padding:4px 12px;border-radius:999px;cursor:pointer}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;background:var(--surface);padding:2px;gap:2px}
.seg button{font:inherit;font-size:13px;border:0;background:transparent;color:var(--ink2);padding:4px 12px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--pt);color:var(--on)}
.seg button:focus-visible{outline:2px solid var(--pt);outline-offset:1px}
[hidden]{display:none!important}
body{margin:0}
</style>
</head>
<body>
<div class="topbar">
  <div class="userbar" id="userbar" hidden><span id="who"></span><button type="button" id="logout">ออกจากระบบ</button></div>
  <div class="seg" role="group" aria-label="โหมดธีม">
    <button type="button" data-t="light">☀ ปกติ</button><button type="button" data-t="dark">☾ มืด</button><button type="button" data-t="auto">อัตโนมัติ</button>
  </div>
</div>
<div class="lock" id="lock">
  <form onsubmit="return false">
    <h1>แผนที่วิธีคิดตัวเลข</h1>
    <p id="msg">รายงานภายใน · วิธีคิดตัวเลขทุกหน้าของรายงาน Power BI สาขา · เข้าสู่ระบบด้วยบัญชี Microsoft 365 ของบริษัท</p>
    <button id="go" type="button" disabled>กำลังตรวจสอบ…</button>
    <button id="out" type="button" class="ghost" hidden>ออกจากระบบ / ลองบัญชีอื่น</button>
    <p class="err" id="err" role="alert"></p>
  </form>
</div>
<div id="content" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.27.0/lib/msal-browser.min.js"></script>

/* ===== ตั้งค่าการเข้าสู่ระบบ Microsoft 365 (แก้ได้ตรงนี้) ===== */
const AUTH = {
  clientId: "75b5084b-4823-4a13-bb79-d47af910fb21",
  tenantId: "54cf0b45-7b5b-41b0-bbeb-dddef5eae512",
  groupId:  "b41f37a8-a4b6-4fd9-b1c7-accdcd508e05",   // กลุ่ม pt_dashboard_viewers
  groupName: "pt_dashboard_viewers",
  redirectUri: location.origin + location.pathname.replace(/index\.html$/, ''),   // ต้องเพิ่ม URL นี้ใน App registration > Authentication (SPA)
  keyShareUrl: "https://sevenutilitiesandpower.sharepoint.com/:t:/g/IQD9BbyRyvyJS57MP9ohZ42TAZJ-AjI-LE9teNSRz5fq31k?e=UlN9qM"   // ลิงก์แชร์ไฟล์กุญแจ pt-member-key.txt ใน SharePoint
};
const SCOPES = ["User.Read", "Files.Read.All"];
(function () {
  const b = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const go = document.getElementById('go'), out = document.getElementById('out'), err = document.getElementById('err');
  const busy = (t) => { go.disabled = true; go.textContent = t; };
  const fail = (t, app) => { err.textContent = t; go.disabled = false; go.textContent = 'เข้าสู่ระบบด้วย Microsoft 365'; if (app) { out.hidden = false; out.onclick = () => app.logoutRedirect(); } };
  if (!window.msal) { fail('โหลดระบบเข้าสู่ระบบ Microsoft ไม่ได้ ตรวจอินเทอร์เน็ตแล้วรีเฟรชหน้า'); go.disabled = true; return; }
  if (!window.crypto || !crypto.subtle) { fail('เบราว์เซอร์นี้เปิดรายงานไม่ได้ ลองเปิดด้วย Chrome, Edge หรือ Safari'); go.disabled = true; return; }
  if (AUTH.keyShareUrl.indexOf('http') !== 0) { fail('ยังไม่ได้ตั้งค่าลิงก์ไฟล์กุญแจ — ติดต่อฝ่าย IT'); go.disabled = true; return; }
  const app = new msal.PublicClientApplication({
    auth: { clientId: AUTH.clientId, authority: 'https://login.microsoftonline.com/' + AUTH.tenantId, redirectUri: AUTH.redirectUri },
    cache: { cacheLocation: 'sessionStorage' }
  });
  const login = () => app.loginRedirect({ scopes: SCOPES, prompt: 'select_account' });
  const shareId = (u) => 'u!' + btoa(unescape(encodeURIComponent(u))).replace(/=+$/, '').replace(/\//g, '_').replace(/\+/g, '-');
  async function token(account) {
    try { return (await app.acquireTokenSilent({ scopes: SCOPES, account })).accessToken; }
    catch (e) { if (e instanceof msal.InteractionRequiredAuthError) { await app.acquireTokenRedirect({ scopes: SCOPES, account }); return null; } throw e; }
  }
  async function fetchKey(tok) {
    const base = 'https://graph.microsoft.com/v1.0/shares/' + shareId(AUTH.keyShareUrl) + '/driveItem';
    const H = { headers: { Authorization: 'Bearer ' + tok } };
    const r = await fetch(base, H);
    if (r.status === 401 || r.status === 403 || r.status === 404) throw new Error('nokey');
    if (!r.ok) throw new Error('graph ' + r.status);
    const item = await r.json();
    let txt = null;
    const dl = item['@microsoft.graph.downloadUrl'] || item['@content.downloadUrl'];
    if (dl) { try { const k = await fetch(dl); if (k.ok) txt = await k.text(); } catch (e) {} }
    if (txt === null && item.id && item.parentReference && item.parentReference.driveId) {
      const k = await fetch('https://graph.microsoft.com/v1.0/drives/' + item.parentReference.driveId + '/items/' + item.id + '/content', H);
      if (k.ok) txt = await k.text();
    }
    if (txt === null) { const k = await fetch(base + '/content', H); if (!k.ok) throw new Error('download ' + k.status); txt = await k.text(); }
    return txt.replace(/^\uFEFF/, '').trim();
  }
  async function open(account) {
    const c = account.idTokenClaims || {};
    if (c.tid && c.tid !== AUTH.tenantId) return fail('บัญชีนี้ไม่ได้อยู่ในองค์กร', app);
    if (AUTH.groupId && !(c.groups || []).includes(AUTH.groupId)) return fail('บัญชีนี้ยังไม่มีสิทธิ์ดูรายงาน (ต้องอยู่ในกลุ่ม ' + AUTH.groupName + ') — ติดต่อฝ่าย IT', app);
    busy('กำลังเปิดรายงาน…');
    try {
      const tok = await token(account); if (!tok) return;
      const raw = await fetchKey(tok);
      const key = await crypto.subtle.importKey('raw', b(raw), 'AES-GCM', false, ['decrypt']);
      const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b(ENC.i) }, key, b(ENC.c));
      const el = document.getElementById('content');
      el.innerHTML = new TextDecoder().decode(plain);
      document.getElementById('lock').hidden = true;
      el.hidden = false;
      document.getElementById('who').textContent = account.name || account.username || '';
      document.getElementById('userbar').hidden = false;
      document.getElementById('logout').onclick = () => app.logoutRedirect({ account });
    } catch (x) {
      console.error(x);
      fail(x && x.message === 'nokey' ? 'บัญชีนี้ยังไม่ได้รับสิทธิ์อ่านไฟล์กุญแจใน SharePoint — ติดต่อฝ่าย IT'
         : x && x.name === 'OperationError' ? 'ไฟล์กุญแจใน SharePoint ไม่ตรงกับรายงานฉบับนี้ — ติดต่อฝ่าย IT'
         : 'เปิดรายงานไม่สำเร็จ (' + ((x && (x.errorCode || x.message)) || 'ไม่ทราบสาเหตุ') + ') ลองรีเฟรชหน้า', app);
    }
  }
  (async () => {
    try {
      await app.initialize();
      const resp = await app.handleRedirectPromise();
      const account = (resp && resp.account) || app.getAllAccounts()[0];
      go.onclick = login;
      if (account) { app.setActiveAccount(account); await open(account); }
      else { go.disabled = false; go.textContent = 'เข้าสู่ระบบด้วย Microsoft 365'; }
    } catch (x) { console.error(x); go.onclick = login; fail('เข้าสู่ระบบไม่สำเร็จ (' + (x.errorCode || x.message) + ')'); }
  })();
})();

<script>
(function () {
  const root = document.documentElement, KEY = 'pt-dash-theme';
  let saved = 'auto'; try { saved = localStorage.getItem(KEY) || 'auto'; } catch (e) {}
  const btns = document.querySelectorAll('.seg button');
  const apply = (t) => {
    if (t === 'auto') root.removeAttribute('data-theme'); else root.setAttribute('data-theme', t);
    btns.forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.t === t)));
    try { localStorage.setItem(KEY, t); } catch (e) {}
  };
  btns.forEach((b) => b.addEventListener('click', () => apply(b.dataset.t)));
  apply(saved);
})();
</script>
