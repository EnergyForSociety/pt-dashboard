<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>แผนที่ตัวเลขสมาชิก STG02</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: one root node → three branch columns (one per report page), then the bridges that join their numbers, then cautions and a question→number guide */
:root{
  --bg:#F3F6F4; --surface:#FFFFFF; --ink:#13241B; --ink2:#3B5045; --line:#C9D6CE;
  --pt:#0E7A3C; --pt-soft:#E3F2E8;
  --seg:#B26A00; --seg-soft:#FBF0DE;      /* กลุ่มลูกค้า = บิล */
  --name:#0E6E85; --name-soft:#E0F1F5;    /* วิเคราะห์สมาชิก = ชื่อ */
  --card:#1D4E9E; --card-soft:#E4ECF9;    /* Active = บัตร */
  --warn:#A8461A; --warn-soft:#FCEDE5;
  --f-display:"IBM Plex Sans Thai","Leelawadee UI","Tahoma",sans-serif;
  --f-body:"IBM Plex Sans Thai","Leelawadee UI","Tahoma",sans-serif;
  --f-num:"IBM Plex Mono","Consolas",monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1713; --surface:#16211B; --ink:#E6EFE9; --ink2:#A9BCB1; --line:#2E3F35;
  --pt:#4CC27E; --pt-soft:#173323;
  --seg:#E9A445; --seg-soft:#2E2412;
  --name:#4BBAD3; --name-soft:#12292F;
  --card:#7FA6EC; --card-soft:#18233A;
  --warn:#F08A5B; --warn-soft:#331C12; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0F1713; --surface:#16211B; --ink:#E6EFE9; --ink2:#A9BCB1; --line:#2E3F35;
  --pt:#4CC27E; --pt-soft:#173323;
  --seg:#E9A445; --seg-soft:#2E2412;
  --name:#4BBAD3; --name-soft:#12292F;
  --card:#7FA6EC; --card-soft:#18233A;
  --warn:#F08A5B; --warn-soft:#331C12; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
.wrap{max-width:1180px;margin:0 auto;padding-block:28px 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.3}
h1{font-size:28px;font-weight:700}
h2{font-size:20px;font-weight:700;margin-bottom:14px}
h3{font-size:16px;font-weight:700}
p{margin:0}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-weight:600}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--ink2)}
.lede{color:var(--ink2);max-width:68ch;margin-top:8px}
section{margin-top:40px}

/* ── mind map ── */
.root{display:flex;justify-content:center;margin-top:28px}
.root-node{background:var(--pt);color:#fff;border-radius:14px;padding:14px 22px;text-align:center;max-width:520px}
.root-node .t{font-size:18px;font-weight:700}
.root-node .s{font-size:13px;opacity:.9}
.src{margin:14px auto 0;max-width:860px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.src div{background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:8px 12px;font-size:13px;color:var(--ink2)}
.src b{color:var(--ink);font-family:var(--f-num);font-size:12.5px;font-weight:600}
.trunk{height:26px;width:2px;background:var(--line);margin:0 auto}
.branches{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;position:relative;padding-top:22px}
.branches::before{content:"";position:absolute;top:0;left:16.6%;right:16.6%;height:2px;background:var(--line)}
.branch{position:relative;min-width:0}
.branch::before{content:"";position:absolute;top:-22px;left:50%;width:2px;height:22px;background:var(--line)}
.bhead{border-radius:12px;padding:12px 14px;border:2px solid var(--c);background:var(--soft)}
.bhead .unit{display:inline-block;background:var(--c);color:#fff;font-size:12px;font-weight:700;border-radius:20px;padding:1px 10px;margin-top:6px}
.bhead .big{font-size:30px;line-height:1.1;color:var(--c);margin-top:8px}
.bhead .big small{font-size:14px;font-family:var(--f-body);font-weight:600;margin-left:4px}
.leaves{list-style:none;margin:0;padding:0 0 0 18px;border-left:2px solid var(--line);margin-left:20px}
.leaves li{position:relative;margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:14px}
.leaves li::before{content:"";position:absolute;left:-20px;top:20px;width:18px;height:2px;background:var(--line)}
.leaves .k{font-weight:700}
.leaves .v{float:right;margin-left:10px;color:var(--c)}
.leaves .how{display:block;color:var(--ink2);font-size:12.5px;margin-top:2px}
.leaves code{font-family:var(--f-num);font-size:12px;background:var(--soft);border-radius:4px;padding:0 4px}
.b-seg{--c:var(--seg);--soft:var(--seg-soft)}
.b-name{--c:var(--name);--soft:var(--name-soft)}
.b-card{--c:var(--card);--soft:var(--card-soft)}

/* ── bridges ── */
.bridges{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.bridge{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.eq{font-family:var(--f-num);font-size:17px;margin:8px 0 6px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.eq span{border-radius:6px;padding:1px 7px}
.eq .s{background:var(--seg-soft);color:var(--seg)} .eq .n{background:var(--name-soft);color:var(--name)} .eq .c{background:var(--card-soft);color:var(--card)}
.bridge p{font-size:13.5px;color:var(--ink2)}

/* ── cautions ── */
.cautions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.caution{background:var(--warn-soft);border-left:4px solid var(--warn);border-radius:8px;padding:12px 16px;min-width:0}
.caution h3{color:var(--warn);font-size:15px}
.caution p{font-size:14px;margin-top:4px}
.sev{display:inline-block;font-size:11.5px;font-weight:700;color:#fff;background:var(--warn);border-radius:20px;padding:0 9px;margin-left:6px;vertical-align:2px}

/* ── guide table ── */
.tbl{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:680px;font-size:14px}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12.5px;color:var(--ink2);font-weight:700;letter-spacing:.03em}
tr:last-child td{border-bottom:0}
.tag{display:inline-block;font-size:12px;font-weight:700;border-radius:20px;padding:0 9px}
.tag.s{background:var(--seg-soft);color:var(--seg)} .tag.n{background:var(--name-soft);color:var(--name)} .tag.c{background:var(--card-soft);color:var(--card)}
.foot{margin-top:28px;font-size:12.5px;color:var(--ink2)}

@media (max-width:860px){
  .branches,.bridges,.src{grid-template-columns:1fr}
  .branches::before,.branch::before{display:none}
  .branches{padding-top:0;gap:26px}
  .cautions{grid-template-columns:1fr}
}


.lock{min-height:80vh;display:grid;place-items:center;padding-block:24px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.lock form{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px;width:min(100%,380px);display:flex;flex-direction:column;gap:12px}
.lock h1{font-size:22px}
.lock p{margin:0;color:var(--ink2);font-size:13.5px;line-height:1.55}
.lock button{font:inherit;font-weight:600;padding:10px 12px;border:0;border-radius:8px;background:var(--pt);color:#fff;cursor:pointer}
.lock button:disabled{opacity:.6;cursor:progress}
.lock button.ghost{background:transparent;color:var(--pt);border:1px solid var(--line)}
.lock .err{color:var(--warn);min-height:1.2em}
.lock button:focus-visible,.userbar button:focus-visible{outline:2px solid var(--pt);outline-offset:2px}
.userbar{max-width:1180px;margin:0 auto;display:flex;justify-content:flex-end;align-items:center;gap:8px;font-size:13px;color:var(--ink2);padding-top:14px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.userbar button{font:inherit;border:1px solid var(--line);background:var(--surface);color:var(--ink2);padding:4px 12px;border-radius:999px;cursor:pointer}
[hidden]{display:none!important}
body{margin:0}
</style>
</head>
<body>
<div class="userbar" id="userbar" hidden><span id="who"></span><button type="button" id="logout">ออกจากระบบ</button></div>
<div class="lock" id="lock">
  <form onsubmit="return false">
    <h1>แผนที่ตัวเลขสมาชิก</h1>
    <p id="msg">รายงานภายใน · วิธีคิดตัวเลขสมาชิกของรายงาน Power BI สาขา · เข้าสู่ระบบด้วยบัญชี Microsoft 365 ของบริษัท</p>
    <button id="go" type="button" disabled>กำลังตรวจสอบ…</button>
    <button id="out" type="button" class="ghost" hidden>ออกจากระบบ / ลองบัญชีอื่น</button>
    <p class="err" id="err" role="alert"></p>
  </form>
</div>
<div id="content" hidden></div>

      if (k.ok) txt = await k.text();
    }
    if (txt === null) { const k = await fetch(base + '/content', H); if (!k.ok) throw new Error('download ' + k.status); txt = await k.text(); }
    return txt.replace(/^\uFEFF/, '').trim();
  }
  async function open(account) {
    const c = account.idTokenClaims || {};
    if (c.tid && c.tid !== AUTH.tenantId) return fail('บัญชีนี้ไม่ได้อยู่ในองค์กร', app);
    if (AUTH.groupId && !(c.groups || []).includes(AUTH.groupId)) return fail('บัญชีนี้ยังไม่มีสิทธิ์ดูรายงาน (ต้องอยู่ในกลุ่ม ' + AUTH.groupName + ') — ติดต่อฝ่าย IT', app);
    busy('กำลังเปิดรายงาน…');
    try {
      const tok = await token(account); if (!tok) return;
      const raw = await fetchKey(tok);
      const key = await crypto.subtle.importKey('raw', b(raw), 'AES-GCM', false, ['decrypt']);
      const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b(ENC.i) }, key, b(ENC.c));
      const el = document.getElementById('content');
      el.innerHTML = new TextDecoder().decode(plain);
      document.getElementById('lock').hidden = true;
      el.hidden = false;
      document.getElementById('who').textContent = account.name || account.username || '';
      document.getElementById('userbar').hidden = false;
      document.getElementById('logout').onclick = () => app.logoutRedirect({ account });
    } catch (x) {
      console.error(x);
      fail(x && x.message === 'nokey' ? 'บัญชีนี้ยังไม่ได้รับสิทธิ์อ่านไฟล์กุญแจใน SharePoint — ติดต่อฝ่าย IT'
         : x && x.name === 'OperationError' ? 'ไฟล์กุญแจใน SharePoint ไม่ตรงกับรายงานฉบับนี้ — ติดต่อฝ่าย IT'
         : 'เปิดรายงานไม่สำเร็จ (' + ((x && (x.errorCode || x.message)) || 'ไม่ทราบสาเหตุ') + ') ลองรีเฟรชหน้า', app);
    }
  }
  (async () => {
    try {
      await app.initialize();
      const resp = await app.handleRedirectPromise();
      const account = (resp && resp.account) || app.getAllAccounts()[0];
      go.onclick = login;
      if (account) { app.setActiveAccount(account); await open(account); }
      else { go.disabled = false; go.textContent = 'เข้าสู่ระบบด้วย Microsoft 365'; }
    } catch (x) { console.error(x); go.onclick = login; fail('เข้าสู่ระบบไม่สำเร็จ (' + (x.errorCode || x.message) + ')'); }
  })();
})();
</script>
